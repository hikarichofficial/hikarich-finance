<text x="144" y="238" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="144" y="254.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Catat Pengeluaran</text>
<text x="144" y="269.5" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Pembelian &gt; Beban &gt; Catat</text>
<text x="144" y="281.5" font-size="9" fill="#1a4d8f" text-anchor="start">Pengeluaran</text>
<text x="144" y="296.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Pilih rekening pembayar, vendor atau nama</text>
<text x="144" y="308" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">penerima, lalu isi satu angka di kolom Nominal</text>
<text x="144" y="319.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">(Rp) sesuai total di struk. Untuk mengisi</text>
<text x="144" y="331" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">banyaknya barang, centang Rinci per barang.</text>
<text x="144" y="342.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Struk memuat PPN: centang Jumlah sudah</text>
<text x="144" y="354" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">termasuk PPN 11% (harga sebelum PPN</text>
<text x="144" y="365.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">dihitung otomatis). Kena PPh? sudah terisi dari</text>
<text x="144" y="377" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">kategori dan vendor, ubah bila perlu. Vendor</text>
<text x="144" y="388.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">menerima total dikurangi PPh; PPh disetor PT</text>
<text x="144" y="400" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">ke negara. Lampirkan struk, simpan sebagai</text>
<text x="144" y="411.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Draf</text>
