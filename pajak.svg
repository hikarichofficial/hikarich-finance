<text x="144" y="576.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Riwayat Pembayaran adalah tautan ke halaman</text>
<text x="144" y="588" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">rincian pembayaran</text>
