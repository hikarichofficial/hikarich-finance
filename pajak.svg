<text x="144" y="734.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Negara (BPN, memuat NTPN) dan Jenis bukti</text>
<text x="144" y="746" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Bukti bayar. Boleh kapan saja, juga bukti yang</text>
<text x="144" y="757.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">baru ada belakangan</text>
