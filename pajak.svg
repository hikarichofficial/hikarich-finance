<text x="144" y="399.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Pilih Jenis Pajak (bawaannya PPh Final UMKM)</text>
<text x="144" y="411" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">dan Masa Pajak, tekan Terapkan. Isi Tanggal</text>
<text x="144" y="422.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Bayar, Pajak Dibayar, dan Akun Pembayar.</text>
<text x="144" y="434" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">PPh Final: tulis NTPN dan Kode Billing. Bayar</text>
<text x="144" y="445.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">paling lambat tanggal 15 bulan berikutnya;</text>
<text x="144" y="457" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">jangan dicatat lewat menu Beban</text>
