<text x="144" y="669.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">pembayaran</text>
<text x="144" y="684.5" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Riwayat Pembayaran &gt; (klik nomor</text>
<text x="144" y="696.5" font-size="9" fill="#1a4d8f" text-anchor="start">TAXPAY) &gt; Lampiran &gt; Unggah Bukti</text>
<text x="144" y="711.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Halaman rincian berisi Ringkasan, Jurnal, dan</text>
