name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    env:
      # Non-secret CI placeholders pointing at a NON-production project (env guard enforces this).
      APP_ENV: development
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_0000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Secret scan
        run: pnpm secrets:check
      - name: Dependency audit (high and above, production dependencies)
        run: pnpm audit --prod --audit-level=high
      - name: Build
        run: pnpm build

  database:
    name: Migration clean-rebuild and invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Use PostgreSQL 17 client tools (pg_dump must match the postgres:17 server)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Show client version
        run: pg_dump --version
      - name: Rebuild database from migrations twice and run invariants
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/postgres
        run: bash scripts/db-test.sh
