name: Production migrations

# Applies supabase/migrations to the PRODUCTION database (Step 14 §6: only migrations change the
# production schema, through the controlled Git-connected path). The files are sent byte for byte by the
# Supabase CLI and recorded in the database's own migration history, so a migration is applied once, in
# order, and never by hand.
#
# Runs when a merge to main changes a migration, and on demand ("Run workflow"). main is protected: a
# migration reaches it only through a pull request whose CI rebuilt the whole database from scratch.
#
# Needs two repository secrets, typed by the OWNER in GitHub (never in code, chat or a file):
#   SUPABASE_ACCESS_TOKEN  a personal access token of the Supabase account
#   SUPABASE_DB_PASSWORD   the database password of the production project
# The seed file is never applied here; it is synthetic data for non-production only.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Not a secret: the project reference is part of the public project URL.
      PRODUCTION_PROJECT_REF: yvuakaxwgwfjyvjmvpbn
    steps:
      - uses: actions/checkout@v4
      - name: Check that the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD must be set as repository secrets (see docs/GO_LIVE.md)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link the production project
        run: supabase link --project-ref "$PRODUCTION_PROJECT_REF"
      # Decision 427, diagnosis: READ ONLY. Prints, as notices on the run, the last rows of the production migration
      # history and which functions of migrations 69-71 exist, so the mismatch can be repaired from facts.
      - name: Report the production history
        continue-on-error: true
        run: |
          pooler="$(cat supabase/.temp/pooler-url)"
          q() { PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$pooler" -At -F ' | ' -c "$1" 2>&1; }
          echo "::notice title=history::$(q "select version, coalesce(name, '-') from supabase_migrations.schema_migrations order by version desc limit 14" | tr '\n' ';')"
          echo "::notice title=functions::$(q "select p.proname from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and (p.proname like 'telegram_sales%' or p.proname in ('telegram_find_expense', 'telegram_attach_receipt')) order by 1" | tr '\n' ',')"
          echo "::notice title=marker::$(q "select p.proname, p.prosrc like '%decision 423%' from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname = 'telegram_identify'")"
          echo "::notice title=p72::$(q "select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname = 'tax_turnover_receivables'")"
      # Decision 427. Migrations 69, 70 and 71 were first applied to production by hand on 21 October 2026, so the
      # history holds three extra rows with generated versions (20261021085345, 20261021101204, 20261021141111) and
      # lacks the file versions of migrations 70 and 71. This step runs only when the CLI names exactly those three
      # remote versions as unknown. It checks in the production database that migration 69 is recorded under its file
      # version and that the functions of migrations 70 and 71 exist, and only then removes the three extra rows and
      # records 70 and 71 under their file versions. No migration SQL is run; any other mismatch still stops the job.
      - name: Align the migration history
        run: |
          set -uo pipefail
          if out="$(supabase db push --dry-run 2>&1)"; then
            echo "The history already matches the files."
            exit 0
          fi
          echo "$out"
          for v in 20261021085345 20261021101204 20261021141111; do
            if ! echo "$out" | grep -q "$v"; then
              echo "::error::The mismatch is not the one decision 427 repairs. Stopping."
              exit 1
            fi
          done
          if ! echo "$out" | grep -q "Remote migration versions not found"; then
            echo "::error::The mismatch is not the one decision 427 repairs. Stopping."
            exit 1
          fi
          pooler="$(cat supabase/.temp/pooler-url)"
          present="$(PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$pooler" -At -c "
            select exists (select 1 from supabase_migrations.schema_migrations where version = '20261104100000')
               and (select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                     where n.nspname = 'public'
                       and p.proname in ('telegram_find_expense', 'telegram_attach_receipt', 'telegram_sales_context',
                                         'telegram_sales_create_customer', 'telegram_sales_customers',
                                         'telegram_sales_find_invoice', 'telegram_sales_issue_invoice',
                                         'telegram_sales_record_payment')) = 8")"
          echo "Migration 69 is recorded and the functions of 70 and 71 exist: $present"
          if [ "$present" != "t" ]; then
            echo "::error::Migrations 69-71 are not all in production, so the history is NOT changed."
            exit 1
          fi
          supabase migration repair --status reverted 20261021085345 20261021101204 20261021141111
          supabase migration repair --status applied 20261105100000 20261106100000
      - name: Show what would be applied
        run: supabase db push --dry-run
      - name: Apply
        run: supabase db push --yes
      - name: Migration history after the run
        run: supabase migration list
