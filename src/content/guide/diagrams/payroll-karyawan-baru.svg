<rect x="18" y="833" width="210" height="105" rx="8" fill="#eef2f8" stroke="#1a2b4a" stroke-width="1.4"/>
<text x="28" y="846" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="28" y="862.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Pilih paket BPJS</text>
<text x="28" y="877.5" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Payroll &gt; Karyawan &gt; (klik karyawan) &gt;</text>
<text x="28" y="889.5" font-size="9" fill="#1a4d8f" text-anchor="start">tab BPJS</text>
<text x="28" y="904.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Pilih satu paket (Lengkap bila ikut semua;</text>
<text x="28" y="916" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Lengkap sudah terpilih bila belum ada data) dan</text>
<text x="28" y="927.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Tingkat risiko JKK, lalu Simpan BPJS</text>
