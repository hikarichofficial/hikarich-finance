<title>Ada Karyawan Baru: Daftarkan Sampai Siap Digaji</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="134" y="18" width="210" height="43" rx="18" fill="#1a2b4a" stroke="#1a2b4a" stroke-width="1.4"/>
<text x="239" y="36.5" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Ada karyawan baru yang akan digaji</text>
<text x="239" y="50" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">(Entity PT)</text>
<polyline points="239,61 239,84" fill="none" stroke="#444444" stroke-width="1.4"/>
<polygon points="239,89 234.5,81 243.5,81" fill="#444444" stroke="#444444" stroke-width="0.5" stroke-linejoin="round"/>
<rect x="134" y="89" width="210" height="139.5" rx="8" fill="#eef2f8" stroke="#1a2b4a" stroke-width="1.4"/>
<text x="144" y="102" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="144" y="118.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Tambah Karyawan</text>
<text x="144" y="133.5" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Payroll &gt; Karyawan &gt; Tambah</text>
<text x="144" y="145.5" font-size="9" fill="#1a4d8f" text-anchor="start">Karyawan</text>
<text x="144" y="160.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Hanya OWNER dan peran Payroll. Isi Nama</text>
<text x="144" y="172" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Lengkap, Tanggal Masuk, Jenis Karyawan, dan</text>
<text x="144" y="183.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Jabatan, lalu Simpan. NIK dan NPWP boleh</text>
<text x="144" y="195" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">dikosongkan dulu. Anda dibawa ke halaman</text>
<text x="144" y="206.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">karyawan dengan tab Ringkasan, Gaji &amp;</text>
<text x="144" y="218" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Komponen, Pajak, BPJS, dan Pekerjaan</text>
<polyline points="239,228.5 239,251.5" fill="none" stroke="#444444" stroke-width="1.4"/>
<polygon points="239,256.5 234.5,248.5 243.5,248.5" fill="#444444" stroke="#444444" stroke-width="0.5" stroke-linejoin="round"/>
<rect x="134" y="256.5" width="210" height="105" rx="8" fill="#eef2f8" stroke="#1a2b4a" stroke-width="1.4"/>
<text x="144" y="269.5" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="144" y="286" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Cek yang masih kurang</text>
<text x="144" y="301" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Payroll &gt; Karyawan &gt; (klik karyawan) &gt;</text>
<text x="144" y="313" font-size="9" fill="#1a4d8f" text-anchor="start">tab Ringkasan</text>
<text x="144" y="328" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Ringkasan menampilkan area yang belum</text>
<text x="144" y="339.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">lengkap (gaji, pajak, BPJS); klik kartunya untuk</text>
<text x="144" y="351" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">langsung ke tabnya</text>
<polyline points="239,361.5 239,384.5" fill="none" stroke="#444444" stroke-width="1.4"/>
<polygon points="239,389.5 234.5,381.5 243.5,381.5" fill="#444444" stroke="#444444" stroke-width="0.5" stroke-linejoin="round"/>
<rect x="134" y="389.5" width="210" height="151" rx="8" fill="#eef2f8" stroke="#1a2b4a" stroke-width="1.4"/>
<text x="144" y="402.5" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="144" y="419" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Isi Gaji &amp; Komponen</text>
<text x="144" y="434" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Payroll &gt; Karyawan &gt; (klik karyawan) &gt;</text>
<text x="144" y="446" font-size="9" fill="#1a4d8f" text-anchor="start">tab Gaji &amp; Komponen</text>
<text x="144" y="461" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Pilih nama komponen dari chip Tambah</text>
<text x="144" y="472.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">penghasilan atau Tambah potongan, atau Ketik</text>
<text x="144" y="484" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">nama sendiri; kode terisi otomatis. Potongan</text>
<text x="144" y="495.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">yang benar-benar mengurangi penghasilan</text>
<text x="144" y="507" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">(Potongan Absensi) dicentang Mengurangi</text>
<text x="144" y="518.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">dasar PPh 21; cicilan pinjaman dan kasbon</text>
<text x="144" y="530" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">tidak. Tekan Simpan Gaji &amp; Komponen</text>
<polyline points="239,540.5 239,563.5" fill="none" stroke="#444444" stroke-width="1.4"/>
<polygon points="239,568.5 234.5,560.5 243.5,560.5" fill="#444444" stroke="#444444" stroke-width="0.5" stroke-linejoin="round"/>
<rect x="134" y="568.5" width="210" height="116.5" rx="8" fill="#eef2f8" stroke="#1a2b4a" stroke-width="1.4"/>
<text x="144" y="581.5" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="144" y="598" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Isi Data Pajak</text>
<text x="144" y="613" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Payroll &gt; Karyawan &gt; (klik karyawan) &gt;</text>
<text x="144" y="625" font-size="9" fill="#1a4d8f" text-anchor="start">tab Pajak</text>
<text x="144" y="640" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Isi Status NPWP/NIK, Status PTKP (huruf =</text>
<text x="144" y="651.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">status kawin, angka = tanggungan, dinilai per 1</text>
<text x="144" y="663" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Januari), dan Metode Pajak, lalu Simpan Data</text>
<text x="144" y="674.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Pajak. Jangan Belum diketahui</text>
<polyline points="239,685 239,708" fill="none" stroke="#444444" stroke-width="1.4"/>
<polygon points="239,713 234.5,705 243.5,705" fill="#444444" stroke="#444444" stroke-width="0.5" stroke-linejoin="round"/>
<polygon points="239,713 389,748 239,783 89,748" fill="#fff6cf" stroke="#8a6d00" stroke-width="1.4" stroke-linejoin="round"/>
<text x="239" y="751.5" font-size="10" font-weight="bold" fill="#3d3000" text-anchor="middle">Karyawan ikut BPJS?</text>
<polyline points="239,783 239,799" fill="none" stroke="#444444" stroke-width="1.4"/>
<polyline points="123,799 355,799" fill="none" stroke="#444444" stroke-width="1.4"/>
<polyline points="123,799 123,828" fill="none" stroke="#444444" stroke-width="1.4"/>
