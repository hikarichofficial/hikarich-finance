<polygon points="123,1122 118.5,1114 127.5,1114" fill="#444444" stroke="#444444" stroke-width="0.5" stroke-linejoin="round"/>
<rect x="18" y="1122" width="210" height="116.5" rx="8" fill="#eef2f8" stroke="#1a2b4a" stroke-width="1.4"/>
<text x="28" y="1135" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="28" y="1151.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Isi Saldo Awal Pajak</text>
<text x="28" y="1166.5" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Payroll &gt; Karyawan &gt; (klik karyawan) &gt;</text>
<text x="28" y="1178.5" font-size="9" fill="#1a4d8f" text-anchor="start">tab Pajak &gt; Saldo awal pajak</text>
<text x="28" y="1193.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Isi penghasilan bruto dan PPh 21 yang sudah</text>
<text x="28" y="1205" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">dipotong sampai bulan terakhir sebelum</text>
<text x="28" y="1216.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">memakai aplikasi (Sampai Bulan), lalu Simpan</text>
<text x="28" y="1228" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Saldo Awal Pajak</text>
<rect x="111.8" y="1097" width="22.4" height="15" rx="7.5" fill="#ffffff" stroke="#8a6d00" stroke-width="1"/>
