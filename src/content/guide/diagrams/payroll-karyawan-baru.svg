<text x="239" y="1426.5" font-size="8.6" font-style="italic" fill="#e9efe9" text-anchor="middle">Berhenti bekerja atau pindah jabatan: tab</text>
<text x="239" y="1438" font-size="8.6" font-style="italic" fill="#e9efe9" text-anchor="middle">Pekerjaan</text>
