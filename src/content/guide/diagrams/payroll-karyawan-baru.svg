<text x="144" y="1299.5" font-size="7" font-weight="bold" fill="#2f5233" text-anchor="start">SISTEM (OTOMATIS)</text>
<text x="144" y="1316" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Karyawan Aktif dan ikut Payroll</text>
<text x="144" y="1329.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">bulan berikutnya</text>
<text x="144" y="1344.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Belum ada jurnal. Uang baru tercatat saat</text>
<text x="144" y="1356" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Payroll diposting</text>
