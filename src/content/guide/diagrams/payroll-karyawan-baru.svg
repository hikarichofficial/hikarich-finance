<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 478 1504" width="478" height="1504" role="img" aria-label="Ada Karyawan Baru: Daftarkan Sampai Siap Digaji" font-family="Helvetica, Arial, sans-serif">
