<polygon points="239,986 389,1029 239,1072 89,1029" fill="#fff6cf" stroke="#8a6d00" stroke-width="1.4" stroke-linejoin="round"/>
<text x="239" y="1019.5" font-size="10" font-weight="bold" fill="#3d3000" text-anchor="middle">Sudah digaji sebelum memakai</text>
<text x="239" y="1032.5" font-size="10" font-weight="bold" fill="#3d3000" text-anchor="middle">aplikasi, dan bukan mulai</text>
<text x="239" y="1045.5" font-size="10" font-weight="bold" fill="#3d3000" text-anchor="middle">Januari?</text>
<polyline points="239,1072 239,1088" fill="none" stroke="#444444" stroke-width="1.4"/>
<polyline points="123,1088 355,1088" fill="none" stroke="#444444" stroke-width="1.4"/>
