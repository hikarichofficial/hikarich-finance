<text x="144" y="118.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Beri tanda pada kategori (sekali</text>
<text x="144" y="132" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">saja)</text>
<text x="144" y="147" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Akuntansi &gt; Kategori &gt; kolom Pajak</text>
<text x="144" y="159" font-size="9" fill="#1a4d8f" text-anchor="start">Pribadi</text>
<text x="144" y="174" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Penjualan usaha, jasa &amp; pekerjaan bebas,</text>
<text x="144" y="185.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">honor dari PT saya, biaya usaha &amp; jasa, setoran</text>
<text x="144" y="197" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">PPh Final, setoran PPh 25. Tanpa tanda berarti</text>
<text x="144" y="208.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">pribadi dan tidak dihitung</text>
