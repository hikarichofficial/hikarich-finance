<polygon points="239,985.5 234.5,977.5 243.5,977.5" fill="#444444" stroke="#444444" stroke-width="0.5" stroke-linejoin="round"/>
<rect x="134" y="985.5" width="210" height="124" rx="8" fill="#e6f2e8" stroke="#2f5233" stroke-width="1.4"/>
<text x="144" y="998.5" font-size="7" font-weight="bold" fill="#2f5233" text-anchor="start">SISTEM (OTOMATIS)</text>
<text x="144" y="1015" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Menghitung dua perkiraan</text>
<text x="144" y="1030" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">PPh Final UMKM 0,5% dari penjualan usaha</text>
<text x="144" y="1041.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">(Rp 500 juta pertama bebas; jasa tidak ikut).</text>
<text x="144" y="1053" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">PPh Progresif dari penghasilan neto: bruto −</text>
<text x="144" y="1064.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">biaya − PTKP, PKP dibulatkan ke ribuan, tarif</text>
<text x="144" y="1076" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">per lapisan, dikurangi pajak yang sudah</text>
<text x="144" y="1087.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">dipotong dan disetor. Angsuran PPh 25 bulanan</text>
<text x="144" y="1099" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">= pajak tahun lalu dikurangi kredit ÷ 12</text>
