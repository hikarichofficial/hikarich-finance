<text x="144" y="1150.5" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="144" y="1167" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Baca hasilnya</text>
<text x="144" y="1182" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Pajak &gt; Pajak Pribadi</text>
<text x="144" y="1197" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Angka besar = perkiraan yang masih harus</text>
<text x="144" y="1208.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">dibayar; kartu Angsuran PPh 25 menunjukkan</text>
<text x="144" y="1220" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">angsuran per bulan. Omzet gabungan dengan</text>
<text x="144" y="1231.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">PT terhadap batas Rp 4,8 miliar tampil di</text>
<text x="144" y="1243" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">bawahnya</text>
