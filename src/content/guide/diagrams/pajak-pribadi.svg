<text x="28" y="440" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Isi jumlah yang masuk ke rekening. Pendapatan</text>
<text x="28" y="451.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">bruto dan kredit pajak dihitung otomatis</text>
