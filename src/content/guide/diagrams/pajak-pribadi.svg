<text x="144" y="986" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Baca hasilnya</text>
<text x="144" y="1001" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Pajak &gt; Pajak Pribadi</text>
<text x="144" y="1016" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Angka besar = perkiraan yang masih harus</text>
<text x="144" y="1027.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">dibayar. Omzet gabungan dengan PT terhadap</text>
