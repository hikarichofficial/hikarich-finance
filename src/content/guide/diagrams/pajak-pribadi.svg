<text x="144" y="619.5" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="144" y="636" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Catat biaya usaha dengan kategori</text>
<text x="144" y="649.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Biaya usaha &amp; jasa</text>
<text x="144" y="664.5" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Pembelian &gt; Biaya</text>
<text x="144" y="679.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Hanya biaya berkategori ini yang mengurangi</text>
<text x="144" y="691" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">penghasilan neto. Belanja pribadi tidak</text>
