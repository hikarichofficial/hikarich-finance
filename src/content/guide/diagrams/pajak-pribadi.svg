<text x="144" y="906.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">per lapisan, dikurangi pajak yang sudah</text>
<text x="144" y="918" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">dipotong</text>
