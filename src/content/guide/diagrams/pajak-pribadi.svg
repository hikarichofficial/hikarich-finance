<text x="144" y="889" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="144" y="905.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Pilih status PTKP (sekali setahun)</text>
<text x="144" y="920.5" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Pajak &gt; Pajak Pribadi &gt; Status PTKP</text>
<text x="144" y="935.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Mis. TK/0 atau K/1. Sebelum dipilih dihitung</text>
<text x="144" y="947" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">TK/0</text>
