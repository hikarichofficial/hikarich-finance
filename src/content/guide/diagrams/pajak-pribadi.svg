<text x="144" y="747.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Pilih status PTKP (sekali setahun)</text>
<text x="144" y="762.5" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Pajak &gt; Pajak Pribadi &gt; Status PTKP</text>
<text x="144" y="777.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Mis. TK/0 atau K/1. Sebelum dipilih dihitung</text>
<text x="144" y="789" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">TK/0</text>
