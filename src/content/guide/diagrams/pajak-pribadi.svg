<text x="144" y="742.5" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="144" y="759" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Catat setoran pajak yang Anda bayar</text>
<text x="144" y="772.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">ke negara</text>
<text x="144" y="787.5" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Pembelian &gt; Biaya (kategori Setoran</text>
<text x="144" y="799.5" font-size="9" fill="#1a4d8f" text-anchor="start">PPh Final UMKM atau Setoran PPh 25)</text>
<text x="144" y="814.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Paling lambat tanggal 15 bulan berikutnya.</text>
<text x="144" y="826" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Setoran mengurangi kurang bayar, bukan</text>
<text x="144" y="837.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">penghasilan neto</text>
