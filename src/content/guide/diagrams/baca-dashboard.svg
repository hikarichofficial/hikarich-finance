<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 1048.5" width="710" height="1048.5" role="img" aria-label="Melihat Kondisi Keuangan Sekilas: Membaca Dashboard" font-family="Helvetica, Arial, sans-serif">
