<polyline points="355,888 355,911" fill="none" stroke="#444444" stroke-width="1.4"/>
<polygon points="355,916 350.5,908 359.5,908" fill="#444444" stroke="#444444" stroke-width="0.5" stroke-linejoin="round"/>
<rect x="250" y="916" width="210" height="78.5" rx="18" fill="#2f5233" stroke="#2f5233" stroke-width="1.4"/>
<text x="355" y="934.5" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Selesai</text>
<text x="355" y="948" font-size="8.6" font-style="italic" fill="#e9efe9" text-anchor="middle">Dashboard hanya membaca; angkanya berasal</text>
<text x="355" y="959.5" font-size="8.6" font-style="italic" fill="#e9efe9" text-anchor="middle">dari jurnal yang sudah diposting. Pajak</text>
<text x="355" y="971" font-size="8.6" font-style="italic" fill="#e9efe9" text-anchor="middle">Penghasilan muncul setelah PPh Final bulan itu</text>
