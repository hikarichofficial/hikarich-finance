<text x="119" y="267" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Administrasi &gt; Backup &amp;</text>
<text x="119" y="279" font-size="9" fill="#1a4d8f" text-anchor="start">Restore &gt; Unduh Backup Penuh</text>
<text x="119" y="294" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Hanya OWNER. PT dan Pribadi</text>
<text x="119" y="305.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">masing-masing. Tidak otomatis,</text>
<text x="119" y="317" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">ulangi rutin</text>
