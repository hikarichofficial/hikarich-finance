<text x="119" y="368.5" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="119" y="385" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Simpan berkas di luar</text>
<text x="119" y="398.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">aplikasi</text>
<text x="119" y="413.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Jangan dibuka lalu disimpan ulang.</text>
<text x="119" y="425" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Isi berkas lampiran tidak ikut</text>
