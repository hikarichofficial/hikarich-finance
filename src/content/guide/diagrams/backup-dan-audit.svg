<text x="28" y="596.5" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="28" y="613" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Pilih berkas di Pulihkan</text>
<text x="28" y="626.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">dari Berkas</text>
<text x="28" y="641.5" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Administrasi &gt; Backup &amp;</text>
<text x="28" y="653.5" font-size="9" fill="#1a4d8f" text-anchor="start">Restore &gt; Pulihkan dari Berkas</text>
<text x="28" y="668.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Hanya ke Entity yang masih</text>
<text x="28" y="680" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">kosong. Berkas diperiksa dulu</text>
