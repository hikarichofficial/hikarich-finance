<text x="144" y="552" font-size="7" font-weight="bold" fill="#1a2b4a" text-anchor="start">ANDA</text>
<text x="144" y="568.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Isi Jumlah dan Diterima di Rekening</text>
<text x="144" y="583.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Dari Siapa, nomor bukti, dan keterangan boleh</text>
<text x="144" y="595" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">dikosongkan. Pelanggan baru bisa ditambah di</text>
<text x="144" y="606.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">tempat. Kolom yang berupa daftar bisa diketik</text>
<text x="144" y="618" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">untuk mencari</text>
