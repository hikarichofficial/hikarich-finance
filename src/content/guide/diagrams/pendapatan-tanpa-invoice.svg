<text x="144" y="678.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">rekening bertambah</text>
<text x="144" y="693.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Pendapatan usaha ikut dasar PPh Final 0,5%.</text>
<text x="144" y="705" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Bunga, dividen, hasil forex, dan sejenisnya</text>
