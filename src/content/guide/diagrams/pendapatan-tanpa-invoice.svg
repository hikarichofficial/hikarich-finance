<text x="144" y="669.5" font-size="7" font-weight="bold" fill="#2f5233" text-anchor="start">SISTEM (OTOMATIS)</text>
<text x="144" y="686" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Jurnal dibuat otomatis dan saldo</text>
<text x="144" y="699.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">rekening bertambah</text>
<text x="144" y="714.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Pendapatan usaha ikut dasar PPh Final 0,5%.</text>
<text x="144" y="726" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Bunga, dividen, hasil forex, dan sejenisnya</text>
<text x="144" y="737.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">tercatat tetapi tidak ikut; hasilnya tampil di Pajak</text>
<text x="144" y="749" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">&gt; Ringkasan Pajak &gt; Penghasilan di Luar PPh</text>
<text x="144" y="760.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Final. Bunga Tabungan dan Bunga Deposito: isi</text>
<text x="144" y="772" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">jumlah yang masuk ke rekening, pajaknya</text>
<text x="144" y="783.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">sudah dipotong bank</text>
