<text x="144" y="437.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Isi Tanggal Uang Diterima dan ketik</text>
<text x="144" y="451" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Jenis Pendapatan</text>
<text x="144" y="466" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Pilih dari daftar, atau ketik nama baru lalu pilih +</text>
<text x="144" y="477.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Tambah ... sebagai jenis pendapatan baru. Di</text>
<text x="144" y="489" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Buku Pribadi, jenis jasa &amp; pekerjaan bebas</text>
<text x="144" y="500.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">menampilkan kolom Pajak yang Dipotong Klien</text>
<polyline points="239,511 239,534" fill="none" stroke="#444444" stroke-width="1.4"/>
<polygon points="239,539 234.5,531 243.5,531" fill="#444444" stroke="#444444" stroke-width="0.5" stroke-linejoin="round"/>
