<text x="28" y="648.5" font-size="9" fill="#1a4d8f" text-anchor="start">Saldo Awal</text>
<text x="28" y="663.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Pilih akun "(rekening kas/bank)". Mata uang</text>
<text x="28" y="675" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">asing: pakai Penyesuaian Lanjutan</text>
