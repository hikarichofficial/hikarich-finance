<text x="260" y="267" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Perlu izin kelola rekening dan Daftar Akun;</text>
<text x="260" y="278.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">praktisnya OWNER</text>
