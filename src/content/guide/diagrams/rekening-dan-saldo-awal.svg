<text x="28" y="238.5" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Isi Jenis, Nama Rekening, Mata</text>
<text x="28" y="252" font-size="10.5" font-weight="bold" fill="#111111" text-anchor="start">Uang, tekan Simpan</text>
<text x="28" y="267" font-size="9" fill="#1a4d8f" text-anchor="start">Menu: Kas &amp; Bank &gt; Rekening &gt; Tambah</text>
<text x="28" y="279" font-size="9" fill="#1a4d8f" text-anchor="start">Akun</text>
<text x="28" y="294" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">Jenis dan Mata Uang tidak bisa diubah setelah</text>
<text x="28" y="305.5" font-size="8.6" font-style="italic" fill="#555555" text-anchor="start">disimpan</text>
